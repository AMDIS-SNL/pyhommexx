# .github/workflows/pyhommexx-ci.yml
#
# CI: reproduce the AMDIS pyhommexx build on a stock GitHub-hosted runner and
# run the sacado unit-test gate.
#
# WHERE THIS LIVES: the AMDIS-SNL/pyhommexx repo (branch `main`), NOT E3SM.
#   - pyhommexx holds only the driver scripts (pyhomme/) and env recipe (env/);
#     the buildable C++/Fortran source lives in AMDIS-SNL/E3SM (branch `master`),
#     which this workflow checks out into ./e3sm as a separate step.
#   - Because a workflow can only path-filter its OWN repo, push/PR triggers
#     here fire on pyhommexx changes; upstream E3SM/HommeXX changes are caught
#     by the nightly `schedule` (and on-demand via workflow_dispatch).
#
# This is a CPU (Serial + OpenMP) translation of env/configure-pyhommexx.sh:
#   - the SNL cluster uses environment modules + prebuilt TPLs under
#     /projects/amdis; a GitHub runner has neither, so we install the toolchain
#     from apt and build/cache Trilinos-Sacado from source.
#   - CUDA is OFF here (no GPU on GitHub-hosted runners).
#   - NetCDF-Fortran comes from apt (libnetcdff-dev) instead of a source build,
#     since Ubuntu ships it (the cluster built it from source only because its
#     modules did not provide it).

name: pyhommexx-ci0

on:
  push:
    branches: [main]
    paths:
      - "pyhomme/**"
      - "env/**"
      - ".github/workflows/pyhommexx-ci.yml"
  pull_request:
    paths:
      - "pyhomme/**"
      - "env/**"
      - ".github/workflows/pyhommexx-ci.yml"
  schedule:
    # Nightly (07:00 UTC) to catch upstream AMDIS-SNL/E3SM drift, which the
    # push/PR path filters above cannot see (different repo).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMAKE_BUILD_TYPE for HommeXX"
        type: choice
        default: RelWithDebInfo   # DEBUG matches the cluster script but is much slower to compile+run
        options: [RelWithDebInfo, DEBUG, Release]
      e3sm_ref:
        description: "AMDIS-SNL/E3SM git ref (branch/tag/SHA) to build"
        type: string
        default: master

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- upstream source -----------------------------------------------------
  E3SM_REPO: AMDIS-SNL/E3SM
  E3SM_REF: ${{ github.event.inputs.e3sm_ref || 'master' }}   # E3SM uses `master`; this repo uses `main`
  # --- versions ------------------------------------------------------------
  TRILINOS_TAG: trilinos-release-16-2-0        # matches env/README.md (Sacado 16.2)
  NANOBIND_VERSION: "2.11.0"                    # from env/requirements.lock.txt
  CMAKE_VERSION: "3.31.6"                       # from amdis-modules.sh
  # --- paths ---------------------------------------------------------------
  TRILINOS_SRC: ${{ github.workspace }}/_deps/trilinos-src
  TRILINOS_BUILD: ${{ github.workspace }}/_deps/trilinos-build
  TRILINOS_INSTALL: ${{ github.workspace }}/_deps/trilinos-install
  E3SM_SRC: ${{ github.workspace }}/e3sm                      # E3SM checked out here (see steps)
  HOMME_SRC: ${{ github.workspace }}/e3sm/components/homme
  HOMME_BUILD: ${{ github.workspace }}/_build-e3sm-amdis
  # --- MPI on a small runner ----------------------------------------------
  OMPI_MCA_rmaps_base_oversubscribe: "1"       # 2-4 cores; let unit tests spawn ranks
  OMPI_CC: gcc-12                              # pin OpenMPI wrappers to the gcc 12 toolchain
  OMPI_CXX: g++-12
  OMPI_FC: gfortran-12

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------------------------------------------------
      # 1. Checkouts. This repo (pyhommexx) at the workspace root; the E3SM
      #    source into ./e3sm. E3SM is public, so no token is needed; if it is
      #    ever made private, add `token: ${{ secrets.E3SM_PAT }}` to the E3SM
      #    checkout below.
      # ---------------------------------------------------------------------
      - name: Checkout pyhommexx (this repo, main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout E3SM source (master, no submodules yet)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E3SM_REPO }}
          ref: ${{ env.E3SM_REF }}
          path: e3sm
          submodules: false
          fetch-depth: 1

      - name: Init only the E3SM submodules HommeXX needs
        working-directory: ${{ env.E3SM_SRC }}
        run: |
          set -euxo pipefail
          # E3SM (and EKAT's nested extern/kokkos) pin git@ SSH URLs the runner
          # cannot auth. A global `insteadOf` rewrite is UNRELIABLE for nested
          # submodule clones (it still used the raw git@ URL), so rewrite the
          # URLs in every .gitmodules directly and `submodule sync` them into
          # .git/config before updating. This is deterministic and does not
          # depend on transport-time rewrite resolution. Keep the global rewrite
          # as a harmless backstop.
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          rewrite_all() {
            # Rewrite every .gitmodules currently on disk, then propagate to config.
            find . -name .gitmodules -exec \
              sed -i 's#git@github.com:#https://github.com/#g' {} +
            git submodule sync --recursive
          }

          # Round 1: top-level .gitmodules only exists yet. Rewrite it, then init
          # ONLY what HommeXX needs (not all 25 E3SM submodules), non-recursively.
          #   - EKAT: added via add_subdirectory(../../externals/ekat), vendors Kokkos.
          #   - scorpio/scorpio_classic + cime (genf90, timing): PIO is ON by default
          #     and reached via committed symlinks in components/homme/utils/.
          rewrite_all
          git submodule update --init --depth 1 \
            externals/ekat externals/scorpio externals/scorpio_classic cime

          # Round 2: now that the first level is checked out, EKAT's own
          # .gitmodules (extern/kokkos, also git@) is present -> rewrite it too,
          # then recursively pull the nested deps (Kokkos) over HTTPS.
          rewrite_all
          git submodule update --init --recursive --depth 1 \
            externals/ekat externals/scorpio externals/scorpio_classic cime

      # ---------------------------------------------------------------------
      # 2. Toolchain from apt (replaces amdis-modules.sh).
      #    gcc/gfortran 12 + OpenMPI 4.1.x + HDF5 + NetCDF-C/Fortran + LAPACK.
      # ---------------------------------------------------------------------
      - name: Install system toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 gfortran-12 \
            libopenmpi-dev openmpi-bin \
            libhdf5-openmpi-dev \
            libnetcdf-dev libnetcdff-dev \
            libblas-dev liblapack-dev \
            ninja-build
          # Make the pinned gcc the default cc/c++/gfortran for any non-MPI probe.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-12 100

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build/runtime deps
        run: |
          set -euxo pipefail
          # needs nanobind (configure-time: `python -m nanobind --cmake_dir`)
          # plus numpy/mpi4py for the smoke import.
          # torch/jax/cartopy from requirements.txt are CUDA wheels irrelevant to
          # the first attempt at CI.
          python -m pip install --upgrade pip
          python -m pip install "cmake==${CMAKE_VERSION}" "nanobind==${NANOBIND_VERSION}" numpy mpi4py
          echo "nanobind cmake dir: $(python -m nanobind --cmake_dir)"
          # confirm pip-installed cmake is on PATH, not system cmake
          echo "cmake on PATH: $(which cmake)"
          cmake --version

      # ---------------------------------------------------------------------
      # 3. Trilinos / Sacado (Sacado-only, from source) with caching.
      #    This is the long pole; cache keyed on the release tag so it is
      #    built once and restored thereafter.
      # ---------------------------------------------------------------------
      - name: Cache Trilinos-Sacado install
        id: cache-trilinos
        uses: actions/cache@v4
        with:
          path: ${{ env.TRILINOS_INSTALL }}
          key: trilinos-${{ env.TRILINOS_TAG }}-ubuntu24-gcc12-${{ env.CMAKE_VERSION }}

      - name: Build Trilinos-Sacado (cache miss only)
        if: steps.cache-trilinos.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$TRILINOS_SRC")"
          curl -sSL \
            "https://github.com/trilinos/Trilinos/archive/refs/tags/${TRILINOS_TAG}.tar.gz" \
            -o /tmp/trilinos.tar.gz
          mkdir -p "$TRILINOS_SRC"
          tar -xzf /tmp/trilinos.tar.gz -C "$TRILINOS_SRC" --strip-components=1
          # Mirrors env/configure-trilinos.sh (Sacado-only, MPI, C++17, OpenMP).
          cmake -B "$TRILINOS_BUILD" -S "$TRILINOS_SRC" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$TRILINOS_INSTALL" \
            -DTPL_ENABLE_MPI=ON \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DTrilinos_ENABLE_Fortran=OFF \
            -DTrilinos_ENABLE_OpenMP=ON \
            -DTrilinos_ENABLE_ALL_PACKAGES=OFF \
            -DTrilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF \
            -DTrilinos_ENABLE_Sacado=ON \
            -DTrilinos_ENABLE_TESTS=OFF
          cmake --build "$TRILINOS_BUILD" --parallel "$(nproc)"
          cmake --install "$TRILINOS_BUILD"

      # ---------------------------------------------------------------------
      # 4. Configure HommeXX / pyhommexx.
      #    CPU translation of env/configure-pyhommexx.sh: CUDA OFF, Serial +
      #    OpenMP ON, FAD types ON, EXECS OFF to keep the build bounded (the
      #    sacado unit tests and the pyhommexx module are still built).
      # ---------------------------------------------------------------------
      - name: Configure HommeXX (pyhommexx, CPU)
        run: |
          set -euxo pipefail
          NF_PREFIX="$(nf-config --prefix)"
          NC_PREFIX="$(nc-config --prefix)"
          cmake -B "$HOMME_BUILD" -S "$HOMME_SRC" \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'RelWithDebInfo' }} \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_Fortran_COMPILER=mpifort \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_Fortran_FLAGS="-fPIC" \
            -DCMAKE_CXX_STANDARD=17 \
            -DHOMME_FIND_BLASLAPACK=ON \
            -DHOMMEXX_BFB_TESTING=OFF \
            -DHOMME_AMDIS_PROJECT=ON \
            -DHOMME_BUILD_PYHOMMEXX=ON \
            -DHOMME_BUILD_EXECS=OFF \
            -DHOMMEXX_ENABLE_FAD_TYPES=ON \
            -DTrilinos_ROOT="$TRILINOS_INSTALL" \
            -DPYHOMMEXX_NLEV=128 \
            -DPYHOMMEXX_QSIZE=10 \
            -DNetCDF_C_PATH="$NC_PREFIX" \
            -DNetCDF_Fortran_PATH="$NF_PREFIX" \
            -DKokkos_ENABLE_CUDA=OFF \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ARCH_NATIVE=ON \
            -DPython_EXECUTABLE="$(which python)"

      - name: Build pyhommexx + sacado unit tests
        run: |
          set -euxo pipefail
          cmake --build "$HOMME_BUILD" --parallel "$(nproc)"

      # ---------------------------------------------------------------------
      # 5. the sacado unit tests
      # ---------------------------------------------------------------------
      - name: Run sacado unit tests
        working-directory: ${{ env.HOMME_BUILD }}
        run: ctest -R sacado -V --output-on-failure

      # ---------------------------------------------------------------------
      # 6. Forward-path gate: model init + one apply_dynamics_forcing call.
      #    pyhomme/demo_forcing.py exercises init_session -> read_params ->
      #    model_init -> init_dp3d_from_ps -> set_forcing[_value] ->
      #    apply_dynamics_forcing -> get_state_var and asserts
      #    Δu == dt*fm_x to roundoff. Failure of any of those paths (missing
      #    symbol, bad namelist, forcing kernel broken) fails CI.
      #    Namelist + vcoord ship in this repo (pyhomme/namelist.nl,
      #    pyhomme/vcoord/), so no external inputs are needed.
      # ---------------------------------------------------------------------
      - name: Forward-path gate (init + apply_dynamics_forcing)
        working-directory: pyhomme
        env:
          PYHOMMEXX_LIB_PATH: ${{ env.HOMME_BUILD }}/src/theta-l_kokkos/pyhommexx
        run: |
          set -euxo pipefail
          ls -l "$PYHOMMEXX_LIB_PATH"/pyhommexx*.so
          python demo_forcing.py -nml namelist.nl

      # ---------------------------------------------------------------------
      # 7. On failure, keep the CMake logs for debugging.
      # ---------------------------------------------------------------------
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            ${{ env.HOMME_BUILD }}/CMakeCache.txt
            ${{ env.HOMME_BUILD }}/CMakeFiles/CMakeError.log
            ${{ env.HOMME_BUILD }}/CMakeFiles/CMakeOutput.log
            ${{ env.HOMME_BUILD }}/Testing/**/*.log
          retention-days: 7
          if-no-files-found: ignore
